<style>
:root{--ink:#04101c;--cu:#3cb8ff;--gold:#ffb86b;--mint:#72f5cf;--tx:#e9f5ff;--mut:#a5bfd6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

<script>
const $=id=>document.getElementById(id);

function ans(id,j,b){const z=Q[id];if(z.a)return;z.a=1;const[q,o,c,e]=z.items[z.i];const bs=b.parentNode.children;bs[c].classList.add('ok');if(j!=c)b.classList.add('no');else z.s++;
 const ex=b.parentNode.nextElementSibling;ex.innerHTML=`<b>${j==c?'إجابة صحيحة ✓':'إجابة غير صحيحة ✗'}</b> — الإجابة الصحيحة: ${T(o[c])}<br>${T(e)}<br><button class=btn onclick="Q[${id}].i++;rq(${id})">${z.i+1<z.items.length?'السؤال التالي':'عرض النتيجة'}</button>`;ex.classList.add('show')}
const sol=(q,steps)=>`<div class="card r">${T(q)}<br><button class=btn onclick="const s=this.nextElementSibling;s.classList.toggle('show');this.textContent=s.classList.contains('show')?'إخفاء الحل':'إظهار الحل'">إظهار الحل</button><div class=sol>${steps.map((x,k)=>`<div style="--k:${k}">${T(x)}</div>`).join('')}</div></div>`;

const S=[];

 cd('<h3>الفكرة الرئيسية للدرس السابق</h3>الصيغة الأولية والصيغة الجزيئية.'),
 cd('<h3>الفكرة الرئيسية لهذا الدرس</h3>الصيغة الجزيئية لمركب ما هي مضاعف عددي صحيح لصيغته الأولية.')]));
S.push(hd('الفكرة الرئيسية للدرس')+big('الصيغة الجزيئية','لمركب ما هي مضاعف عددي صحيح لصيغته الأولية'));

 cd('<h3>التعريف</h3>الصيغة الأولية هي أبسط نسبة عددية صحيحة بين أعداد ذرات العناصر في المركب.'),
 cd('<h3>الشرح</h3>'+li(['تُحسب من كتل العناصر أو نسبها المئوية.','نحوّل الكتل إلى مولات، ثم نقسم الجميع على أصغر عدد مولات.','الجلوكوز [[C6H12O6]] صيغته الأولية [[CH2O]].','فوق أكسيد الهيدروجين [[H2O2]] صيغته الأولية [[HO]].']))]));
S.push(hd('الصيغة الجزيئية')+gr([
 cd('<h3>التعريف</h3>الصيغة الجزيئية تبيّن العدد الفعلي لذرات كل عنصر في جزيء واحد من المركب.'),
 cd('<h3>الشرح</h3>'+li(['الصيغة الجزيئية = n × الصيغة الأولية (n عدد صحيح).','n = الكتلة المولية للمركب ÷ كتلة الصيغة الأولية.','مثال: كتلة [[CH2O]] = 30.03 g/mol، وكتلة الجلوكوز المولية 180.16 g/mol، إذن n = 6 فتكون الصيغة [[C6H12O6]].']))]));
S.push(hd('أسئلة سريعة: الصيغة الأولية والجزيئية')+qz(1,[
 ['الصيغة الأولية هي:',['العدد الفعلي للذرات في الجزيء','أبسط نسبة عددية صحيحة بين ذرات العناصر','كتلة المركب','لون المركب'],1,'الصيغة الأولية تعبّر عن أبسط نسبة صحيحة بين الذرات.'],
 ['الصيغة الجزيئية لمركب هي:',['مضاعف عددي صحيح لصيغته الأولية','نصف صيغته الأولية','دائمًا تساوي الأولية','لا علاقة لها بالأولية'],0,'الصيغة الجزيئية = n × الصيغة الأولية.'],
 ['الصيغة الأولية للجلوكوز [[C6H12O6]] هي:',['[[CH2O]]','[[C2H4O2]]','[[C3H6O3]]','[[CHO]]'],0,'نقسم أعداد الذرات على 6 فنحصل على [[CH2O]].'],
 ['الصيغة التي تبيّن العدد الفعلي لذرات كل عنصر في الجزيء هي:',['الصيغة الأولية','الصيغة الجزيئية','الصيغة المائية','صيغة النسبة'],1,'هذا تعريف الصيغة الجزيئية.']]));
S.push(hd('الفكرة الرئيسية للدرس')+big('الأملاح المائية','مركبات أيونية صلبة فيها جزيئات ماء محتجزة'));
S.push(hd('الملح المائي وتسميته')+gr([
 cd('<h3>التعريف</h3>الملح المائي مركب أيوني صلب بلوري يحتجز عددًا ثابتًا من جزيئات الماء داخل بلّورته، تُسمّى ماء التبلور. الماء جزء من البلورة وليس رطوبة على سطحها.'),
 cd('<h3>الصيغة</h3>[[CuSO4·5H2O]] — النقطة تعني أن الماء مرتبط بالملح، والرقم x يمثل عدد مولات الماء لكل مول من الملح. الملح بعد فقدان مائه يسمى <b>لامائيًا</b>.'),
 cd('<h3>قاعدة التسمية</h3>نكتب اسم المركب الأيوني ثم عدد جزيئات الماء بالبادئة مع كلمة «الماء». مثال: [[CuSO4·5H2O]] ← كبريتات النحاس (II) خماسية الماء.')]));
